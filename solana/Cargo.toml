[workspace]
members = ["crates/maivw-attestation", "programs/maivw-registry"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
# The Agave 3.1.10 SBF toolchain ships rustc 1.89. Host development remains
# pinned to 1.93.1 in rust-toolchain.toml.
rust-version = "1.89"

[workspace.dependencies]
anchor-lang = { version = "=1.0.1", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.1", default-features = false, features = ["associated_token", "token"] }
maivw-attestation = { path = "crates/maivw-attestation" }
solana-instruction = "=3.5.1"
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
